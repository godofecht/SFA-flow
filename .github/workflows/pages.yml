name: Publish SFA research showcase

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "site/**"
      - "flow.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "site/**"
      - "flow.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-sfa
  cancel-in-progress: false

jobs:
  build:
    name: Build verified Flow experiment site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Check out pinned Flow compiler
        uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: 957b12450eab346dfc31cd019c63da73dfbc86e6
          path: .flow-toolchain

      - name: Install Flow prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang make libomp-dev

      - name: Install browser WebAssembly toolchain
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends emscripten

      - name: Validate exporter and browser JavaScript
        run: |
          python3 -m unittest discover -s site/tests -v
          node --check site/app.js
          node --check site/live.js

      - name: Run native Flow numerical regression suites
        env:
          FLOW_LDFLAGS: -lm
        run: |
          ./.flow-toolchain/flow run tests/smoke.flow
          ./.flow-toolchain/flow run tests/network_stats.flow
          ./.flow-toolchain/flow run tests/browser.flow

      - name: Generate one-invariance experiment
        env:
          FLOW_LDFLAGS: -lm
          SFA_RATE: "5"
          SFA_SEED: "12345"
        run: |
          mkdir -p data
          ./.flow-toolchain/flow run src/main.flow

      - name: Generate two-invariance experiment
        env:
          FLOW_LDFLAGS: -lm
          SFA_MODE: "2"
          SFA_RATE: "2"
          SFA_SEED: "12345"
        run: |
          ./.flow-toolchain/flow run src/main.flow

      - name: Compile actual Flow solver to browser WebAssembly
        run: |
          ./.flow-toolchain/flow wasm src/browser.flow \
            --out build/sfa-live-wasm \
            --name sfa_engine \
            --emcc-flag=-sENVIRONMENT=web,node \
            --emcc-flag=-sEXPORTED_RUNTIME_METHODS=ccall \
            --emcc-flag=-sEXPORTED_FUNCTIONS=_main,_malloc,_free,_sfa_web_create,_sfa_web_destroy,_sfa_web_step,_sfa_web_reset_history,_sfa_web_y0,_sfa_web_y1,_sfa_web_objective,_sfa_web_input_a,_sfa_web_input_b,_sfa_web_weight,_sfa_web_input_count,_sfa_web_output_count
          test -s build/sfa-live-wasm/sfa_engine.wasm
          test -s build/sfa-live-wasm/sfa_engine.js

      - name: Execute both Flow SFA models inside WebAssembly
        run: node site/tests/live_wasm.cjs

      - name: Package scientific traces and static site
        run: |
          mkdir -p _site/data
          cp site/index.html site/styles.css site/app.js site/live.js _site/
          mkdir -p _site/wasm
          cp build/sfa-live-wasm/sfa_engine.js build/sfa-live-wasm/sfa_engine.wasm _site/wasm/
          python3 site/build_results.py --data-dir data --output _site/data/results.json --one-rate 5 --two-rate 2 --seed 12345
          touch _site/.nojekyll
          test -s _site/data/results.json
          python3 -m json.tool _site/data/results.json > /dev/null

      - name: Upload GitHub Pages website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy research showcase
        id: deployment
        uses: actions/deploy-pages@v4
